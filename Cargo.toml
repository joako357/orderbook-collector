[package]
name = "engineering-challenge"
version = "0.1.0"
edition = "2024"
build = "src/util/build.rs"

[dependencies]
anyhow = "1"
base64 = "0.23.1"
chrono = "0.4"
crossbeam = "0.8.4"
ed25519-dalek = { version = "2.2.0", features = ["pkcs8", "pem"] }
futures-util = "0.3.34"
rand_core = { version = "0.6.4", features = ["getrandom"] }
reqwest = { version = "0.13.5", default-features = false, features = ["gzip", "rustls"] }
rsa = { version = "0.9.10", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }

[[example]]
name = "latency"
# So that `cargo test` runs its tests of the matching, the percentiles and the SNTP arithmetic.
test = true

[build-dependencies]
ergo-sbe = "=0.1.16"
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.9"

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["io-util", "test-util"] }
